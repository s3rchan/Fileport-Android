name: Build Fileport Android APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android.yml"
      - "app/**"
      - "scripts/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fileport-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Android sources
        shell: bash
        run: |
          test -f settings.gradle || { echo "Missing settings.gradle in repository root."; exit 1; }
          test -f app/build.gradle || { echo "Missing app/build.gradle in repository."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate official Fileport Android icons
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 scripts/generate_brand_icons.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in app/src/main/assets/*.js; do
            node --check "$file"
          done

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fileport-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
