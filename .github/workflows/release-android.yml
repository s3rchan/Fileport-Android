name: Publish Fileport Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: fileport-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Check version tag matches Android source
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag"; exit 1; }
          grep -F "versionName '$VERSION'" app/build.gradle || { echo "Version tag does not match app/build.gradle"; exit 1; }
          echo "FILEPORT_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in app/src/main/assets/*.js; do
            node --check "$file"
          done

      - name: Prepare protected release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FILEPORT_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FILEPORT_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FILEPORT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FILEPORT_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set the four FILEPORT_ANDROID_* signing secrets before publishing a Release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fileport-release.jks"
          chmod 600 "$RUNNER_TEMP/fileport-release.jks"
          echo "FILEPORT_KEYSTORE_PATH=$RUNNER_TEMP/fileport-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          FILEPORT_KEYSTORE_PASSWORD: ${{ secrets.FILEPORT_ANDROID_KEYSTORE_PASSWORD }}
          FILEPORT_KEY_ALIAS: ${{ secrets.FILEPORT_ANDROID_KEY_ALIAS }}
          FILEPORT_KEY_PASSWORD: ${{ secrets.FILEPORT_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature and prepare release files
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Signed APK not found"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          APK_NAME="Fileport-Android-v${FILEPORT_RELEASE_VERSION}.apk"
          cp "$APK" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK_NAME="Fileport-Android-v${FILEPORT_RELEASE_VERSION}.apk"
          gh release create "$GITHUB_REF_NAME" "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --title "Fileport Android v${FILEPORT_RELEASE_VERSION}" \
            --generate-notes --verify-tag
